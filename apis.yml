apis:
- aid: ocient:http-query-api
  name: Ocient HTTP Query API
  description: 'The Ocient HTTP Query API executes SQL statements against an Ocient
    System over HTTPS and returns results as JSON. It runs on the SQL Nodes of an Ocient
    deployment behind an OpenAPI-enabled connectivity pool, and exposes endpoints for
    executing statements, retrieving system version information, password login and
    logout, and a full OpenID Connect single sign-on flow including authorization-code
    callback, token exchange, device grant, device grant verification, and token refresh.
    Each Ocient SQL Node also serves its own OpenAPI definition at /openapi.yaml and
    /openapi.json.'
  humanURL: https://docs.ocient.com/ocient-http-query-api
  baseURL: https://docs.ocient.com/api-playgrounds/ocient-http-query-api

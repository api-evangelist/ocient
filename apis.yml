aid: ocient
name: Ocient
description: 'Ocient is a Chicago-based data platform company founded in 2016 that builds
  OcientAIQ, a unified data platform for petabyte-scale analytics and production AI.
  Its Compute-Adjacent Storage Architecture (CASA) colocates NVMe storage with compute
  so that ingest, query optimization, machine learning, geospatial analysis, security
  and governance run against very large datasets without moving the data. The platform
  is reached with standard SQL over a JDBC driver, the pyocient Python DB-API 2.0 driver,
  a SQLAlchemy dialect, an Apache Spark connector, and an HTTP Query API that executes
  SQL statements over REST and returns JSON. Ocient serves communications service providers,
  national security and intelligence, adtech, and financial services customers, and
  offers OcientCloud, customer-deployed, and hybrid deployment models.'

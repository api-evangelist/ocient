- aid: ocient:system-information-rest-endpoints
  name: Ocient System Information REST Endpoints
  description: 'Read-only REST endpoints exposed by Ocient System nodes for operational
    visibility. They return the software version, the running status of the node, per-node
    database statistics, the JSON configuration of an individual node, the configuration
    of the system as a whole, and the values of named configuration parameters. These
    endpoints are used for monitoring, health checking, and confirming configuration
    across an Ocient cluster.'
  humanURL: https://docs.ocient.com/api-playgrounds/system-information-rest-endpoints/get-version
  baseURL: https://docs.ocient.com/api-playgrounds/system-information-rest-endpoints
